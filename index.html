<div class="action-buttons">
                    <a id="pdf-download" href="#" class="btn-action btn-pdf" target="_blank">📥 Download PDF</a>
                    <a id="excel-download" href="#" class="btn-action btn-excel" target="_blank">📊 Download Excel</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypcWUrkJTgcSxB05noWOXEuiG8tMwF0ZLbYhk9aaNZPQZ2G4ook6XHHggslLFf30tZ/exec";

        function previewImages(event) {
            const files = event.target.files;
            const container = document.getElementById('image-preview-container');
            container.innerHTML = '';
            
            if (files.length > 0) {
                document.getElementById('preview-section').style.display = 'block';
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(files[i]);
                }
            }
        }

        function processImages() {
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length === 0) {
                alert("Please select images first.");
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('download-links').style.display = 'none';

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('file', fileInput.files[i]);
            }

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.status === "success") {
                    document.getElementById('pdf-download').href = data.pdf_url;
                    document.getElementById('excel-download').href = data.excel_url;
                    document.getElementById('download-links').style.display = 'block';
                } else {
                    alert("Error: " + (data.message || "An error occurred during processing."));
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                alert("Connection error with the server. Please check your internet connection.");
            });
        }
    </script>
</body>
</html>
